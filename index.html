<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="船を走らせるだけ、釣りは全自動。3分でカツオを何本獲れるかを競うスコアアタック。">
<meta name="theme-color" content="#03121d">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="カツオ一本釣り / Fish On! ~Pole & Line">
<meta property="og:description" content="マウスで進む向きだけを決める3分間のスコアアタック。魚群に船べりを寄せると漁師が自動で一本釣りする。">
<meta property="og:type" content="website">
<title>カツオ一本釣り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1+Code:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 単一ビジュアルワールド（外洋・夜明けの海）に意図的にコミットしたゲーム画面。
     ホストのテーマに関わらず同じ絵を出すため、全色を明示的に塗る。 */
  :root{
    --abyss:#03121d;
    --deep:#072a42;
    --sea:#0b3d5e;
    --panel:#0a1f2e;
    --panel2:#0e2a3d;
    --line:#1c4b68;
    --line2:#2c6c8f;
    --foam:#eaf3f4;
    --mist:#9db8c6;
    --dim:#67879a;
    --gold:#f2b32c;
    --gold2:#c98a12;
    --hata:#e0332c;
    --kelp:#3fbfa0;
    --wood:#3a2717;
    --wood2:#54381f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--abyss); color:var(--foam);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .num{font-family:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
  .disp{font-family:"Reggae One","Zen Kaku Gothic New",system-ui,sans-serif; font-weight:400; letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

  #stage{position:fixed; inset:0; display:grid; place-items:center;
    background:radial-gradient(120% 100% at 50% 0%, #0a2436 0%, #03121d 70%)}
  #frame{
    position:relative; aspect-ratio:16/9;
    width:min(100vw, calc(100vh * 16 / 9)); height:auto; max-height:100vh;
    font-size:calc(min(100vw, 100vh * 16 / 9) / 64);
    overflow:hidden; touch-action:none; cursor:crosshair;
    box-shadow:0 0 0 1px #12374d, 0 30px 90px -30px #000;
  }
  #game{position:absolute; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;}

  /* ---- HUD ---- */
  #hud{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s}
  #hud.on{opacity:1}
  .topbar{position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start;
    justify-content:space-between; gap:1em; padding:.85em 1em}

  .clock{display:flex; align-items:baseline; gap:.5em;
    background:linear-gradient(180deg,rgba(10,31,46,.92),rgba(6,22,34,.92));
    border:1px solid var(--line); border-left:3px solid var(--gold);
    padding:.35em .8em .4em; border-radius:2px}
  .clock .k{font-size:.72em; letter-spacing:.22em; color:var(--dim)}
  .clock .v{font-size:1.7em; font-weight:700; letter-spacing:.02em}
  .clock.warn .v{color:#ff8b6a}
  .clock.warn{border-left-color:#ff8b6a}

  .catch{position:relative; text-align:right; padding:.3em 1em .45em 1.9em;
    background:linear-gradient(180deg,#e0332c,#b31f1c); transition:background .2s ease;
    clip-path:polygon(1.5em 0, 100% 0, 100% 100%, 0 100%);
    box-shadow:0 6px 22px -10px #000}
  .catch .k{font-size:.7em; letter-spacing:.24em; color:#ffd9c9; display:block; line-height:1}
  .catch .v{display:inline-block; transform-origin:100% 60%; font-size:2.1em; line-height:1.05;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.28)}
  .catch .u{font-size:.9em; margin-left:.15em}
  .catch.hot{background:linear-gradient(180deg,#f7c245,#d1830d)}
  .catch.hot .k{color:#6b4a10}

  .lvbar{position:absolute; top:4.1em; left:50%; transform:translateX(-50%);
    width:30%; min-width:12em}
  .lvbar .row{display:flex; justify-content:space-between; align-items:baseline;
    font-size:.66em; letter-spacing:.2em; color:var(--dim); margin-bottom:.35em}
  .lvbar .track{height:.36em; background:rgba(3,18,29,.8); border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .lvbar .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--kelp),var(--gold)); transition:width .18s linear}

  .stats{position:absolute; left:1em; bottom:1em; display:flex; gap:.4em; flex-wrap:wrap; max-width:60%}
  .chip{display:flex; align-items:center; gap:.35em; padding:.3em .5em;
    background:rgba(10,31,46,.82); border:1px solid var(--line); border-radius:2px; opacity:.55}
  .chip.has{opacity:1; border-color:var(--line2)}
  .chip canvas{width:1.4em; height:1.4em; image-rendering:pixelated; display:block}
  .chip b{font-size:.72em; font-weight:500; color:var(--mist); letter-spacing:.06em}
  .chip i{font-style:normal; font-size:.82em; font-weight:700; color:var(--gold);
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .cap{color:#ff6b5c}
  #stats.dbg .chip{pointer-events:auto; cursor:pointer; opacity:1;
    border-color:var(--kelp); box-shadow:0 0 0 1px rgba(63,191,160,.25)}
  #stats.dbg .chip:hover{background:rgba(63,191,160,.22)}
  #stats.dbg .chip:active{transform:translateY(1px)}
  .chip i u{text-decoration:none; font-size:.72em; font-weight:500; color:#c2ad83; margin-left:.1em}

  .sonar{position:absolute; right:1em; bottom:1em; width:11em; text-align:right}
  .sonar canvas{width:100%; aspect-ratio:1; display:block; border-radius:50%;
    box-shadow:0 0 0 1px var(--line), 0 0 30px -8px rgba(63,191,160,.5), inset 0 0 20px rgba(0,0,0,.6)}

  /* 入れ食い：メーターが溜まるほど縁が焼ける。溜まりきると判子が落ちる */
  .fever{position:absolute; inset:0; pointer-events:none; opacity:0; z-index:2;
    background:radial-gradient(115% 78% at 50% 50%, rgba(224,51,44,0) 42%, rgba(224,51,44,.34) 100%);
    box-shadow:inset 0 0 4.2em 1.5em rgba(224,51,44,.8), inset 0 0 1.5em .45em rgba(255,146,86,.6)}
  .fever.hot{animation:fvpulse .48s ease-in-out infinite alternate}
  @keyframes fvpulse{from{filter:brightness(.72)} to{filter:brightness(1.4)}}
  @media (prefers-reduced-motion:reduce){ .fever.hot{animation:none; filter:brightness(1)} }
  /* 背景がそのままラウンドの残り時間。空になると継続抽選 */
  .fvbadge{position:absolute; top:6.2em; left:50%; display:flex; align-items:baseline; gap:.55em;
    padding:.22em .9em .3em; opacity:0; transform:translate(-50%,0) scale(1.7); overflow:hidden;
    background:linear-gradient(180deg,#4a0f0c,#2c0806); border:1px solid #ff8b6a; border-radius:2px;
    box-shadow:0 .5em 1.5em -.4em rgba(224,51,44,.95);
    transition:opacity .14s ease, transform .16s cubic-bezier(.2,1.5,.4,1)}
  .fvbadge.on{opacity:1; transform:translate(-50%,0) scale(1)}
  .fvbar{position:absolute; left:0; top:0; bottom:0; width:100%;
    background:linear-gradient(180deg,#e0332c,#a81d18)}
  .fvbar.low{background:linear-gradient(180deg,#ff9a3c,#d1830d)}
  .fvbadge b,.fvbadge em,.fvbadge i{position:relative; z-index:1}
  .fvbadge b{font-size:.92em; font-weight:700; letter-spacing:.26em; color:#fff}
  .fvbadge em{font-style:normal; font-size:.82em; font-weight:700; color:#ffd0a0; letter-spacing:.04em}
  .fvbadge i{font-style:normal; font-size:1.1em; font-weight:700; color:#ffe6a8}
  /* 発動の瞬間に大きく落ちる字 */
  .fvbig{position:absolute; left:50%; top:29%; z-index:3; pointer-events:none; white-space:nowrap;
    opacity:0; transform:translate(-50%,-50%) scale(3.2);
    font-size:4.4em; letter-spacing:.08em; color:#fff;
    text-shadow:0 0 .35em rgba(255,190,90,.95), 0 .05em 0 #a81d18, 0 .06em .02em #6b0f0c, 0 .3em 1em rgba(0,0,0,.75)}
  .fvbig.go{animation:fvslam 1.1s cubic-bezier(.18,1.5,.3,1) both}
  @keyframes fvslam{
    0%{opacity:0; transform:translate(-50%,-50%) scale(3.2)}
    14%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    22%{transform:translate(-50%,-50%) scale(1.08)}
    32%{transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.3)}
  }
  @media (prefers-reduced-motion:reduce){
    .fvbig.go{opacity:1; transform:translate(-50%,-50%) scale(1)}
  }

  .toast{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:.3em; text-align:center;
    opacity:0; transition:opacity .3s}
  .toast.on{opacity:1}
  .toast .hd{font-size:1.1em; color:var(--gold); letter-spacing:.2em}
  .toast .it{font-size:.85em; color:var(--foam); background:rgba(3,18,29,.7); padding:.15em .7em; border:1px solid var(--line)}

  /* ---- overlays ---- */
  .scrim{position:absolute; inset:0; display:none; place-items:center; padding:1.5em; cursor:default;
    background:radial-gradient(120% 90% at 50% 40%, rgba(4,26,42,.86), rgba(2,12,20,.95));
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); pointer-events:auto}
  .scrim.on{display:grid}

  .prompt{position:absolute; inset:0; display:grid; justify-items:center; align-content:space-between;
    text-align:center; pointer-events:none; padding:2.2em 1.5em 2.6em; opacity:1;
    transition:opacity .45s ease;
    background:linear-gradient(180deg, rgba(3,18,29,.72) 0%, rgba(3,18,29,0) 38%, rgba(3,18,29,0) 62%, rgba(3,18,29,.66) 100%)}
  .prompt.gone{opacity:0}
  .tap{margin:0; font-size:.9em; letter-spacing:.24em; color:var(--mist);
    animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55} 50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ .tap{animation:none; opacity:.85} }
  .kanji{font-size:.8em; letter-spacing:.7em; color:var(--gold); margin-bottom:.6em}
  h1{margin:0; font-size:3.4em; line-height:1.1; text-wrap:balance;
    color:var(--foam); text-shadow:0 .06em 0 #08202f, 0 .5em 1.4em rgba(0,0,0,.6)}
  h1 em{font-style:normal; color:var(--hata)}
  .tsub{margin:.25em 0 0; font-size:1em; letter-spacing:.06em; color:var(--mist)}
  .tsub:empty{display:none}
  .lede{margin:.9em auto 0; max-width:26em; font-size:.92em; line-height:1.85; color:var(--mist)}
  .keys{display:flex; gap:1.4em; justify-content:center; margin-top:1.4em; flex-wrap:wrap}
  .keys div{font-size:.78em; color:var(--dim)}
  .keys b{display:block; font-size:1.15em; color:var(--foam); font-weight:500; margin-bottom:.2em}
  button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
  .go{margin-top:1.6em; padding:.7em 2.6em; font-size:1.05em; letter-spacing:.3em;
    color:#2a0b09; background:linear-gradient(180deg,#ffc44a,#e09b12);
    border-radius:2px; box-shadow:0 10px 26px -12px rgba(242,179,44,.8);
    transition:transform .12s ease, box-shadow .12s ease}
  .go:hover{transform:translateY(-2px); box-shadow:0 16px 30px -12px rgba(242,179,44,.9)}
  .go:active{transform:translateY(0)}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .best{margin-top:.7em; font-size:.78em; letter-spacing:.18em; color:var(--dim)}

  /* level up */
  #levelup .box{text-align:center}
  .lvhd{font-size:.78em; letter-spacing:.44em; color:var(--gold); margin-bottom:.25em}
  .lvsub{font-size:1.5em; margin-bottom:1.1em; color:var(--foam)}
  .cards{display:flex; gap:1em; justify-content:center; flex-wrap:wrap}
  .card{position:relative; width:11.5em; padding:1.1em .9em 1em; text-align:center;
    background:linear-gradient(180deg,#432e1b,#2c1d10);
    border:1px solid #6b4a26; border-top:3px solid var(--gold); border-radius:2px;
    box-shadow:0 18px 34px -18px #000; cursor:pointer;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease}
  .card:hover{transform:translateY(-6px); border-color:var(--gold); box-shadow:0 26px 40px -18px #000}
  .card .no{position:absolute; top:.4em; left:.55em; font-size:.66em; color:#9c7c50}
  .card canvas{width:3.4em; height:3.4em; image-rendering:pixelated; margin:.2em auto .55em; display:block}
  .card .nm{font-size:1.05em; font-weight:700; color:#ffe9bd}
  .card .lv{font-size:.7em; letter-spacing:.16em; color:var(--gold); margin-top:.15em}
  .card .val{display:flex; align-items:baseline; justify-content:center; gap:.3em; flex-wrap:wrap;
    margin-top:.6em; font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .card .val s{text-decoration:none; font-size:1em; color:#a4855c}
  .card .val em{font-style:normal; color:#8a6f4a; font-size:.9em}
  .card .val b{font-size:1.6em; line-height:1; color:var(--gold); font-weight:700}
  .card .val i{font-style:normal; font-size:.78em; color:#c7ab82}
  .card .ef{font-size:.76em; color:#e2cda6; margin-top:.5em; line-height:1.5}
  .card .fl{font-size:.7em; color:#a98f6b; margin-top:.5em; line-height:1.5}
  .card.max{opacity:.55}

  /* result */
  #result .box{text-align:center; min-width:min(30em,90%)}
  .rhd{font-size:.78em; letter-spacing:.5em; color:var(--dim)}
  .score{font-size:4.6em; line-height:1; color:var(--gold); margin:.1em 0 .05em;
    text-shadow:0 .04em 0 #6b4a10, 0 .3em 1.2em rgba(242,179,44,.35)}
  .score span{font-size:.32em; letter-spacing:.1em; margin-left:.2em; color:var(--foam)}
  .rank{font-size:1.15em; color:var(--foam); margin-top:.2em}
  .rank small{display:block; font-size:.6em; color:var(--mist); margin-top:.35em; letter-spacing:.06em}
  .grow{margin-top:.9em; font-size:.95em; color:var(--mist);
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .grow s{text-decoration:none; color:var(--dim)}
  .grow b{font-size:1.45em; color:var(--gold); margin:0 .1em}
  .grow em{font-style:normal; color:var(--hata); font-weight:700; margin-left:.4em}
  .rrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    gap:1em 1.2em; margin:1.3em auto 0; max-width:22em}
  .rrow div{font-size:.72em; color:var(--dim); letter-spacing:.1em}
  .rrow b{display:block; font-size:1.45em; color:var(--foam); font-weight:500; letter-spacing:0;
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .rrow b span{font-size:.5em; color:var(--mist); margin-left:.1em}
  .rrow em{display:block; font-style:normal; font-size:.92em; color:#4f6c7d; letter-spacing:0; margin-top:.1em}
  .newbest{display:inline-block; margin-top:.7em; padding:.2em .9em; font-size:.72em; letter-spacing:.28em;
    color:#fff; background:var(--hata)}

  /* 位置指定は外側で行う。#perf 自身に font-size を持たせると em の基準が変わってしまう */
  #perfwrap{position:absolute; left:1em; top:6.9em; pointer-events:none}
  #perf{padding:.45em .6em; background:rgba(4,20,32,.82); border:1px solid var(--line);
    border-left:3px solid var(--kelp); border-radius:2px;
    font-family:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums; font-size:.62em; line-height:1.65; color:var(--mist);
    white-space:pre; letter-spacing:.02em}
  #perf b{color:var(--foam); font-weight:700}
  #perf i{font-style:normal; color:var(--kelp)}
  #perf u{text-decoration:none; color:var(--dim)}
  #perf .hot{color:#ff8b6a}
  .mute{position:absolute; left:1em; top:4em; pointer-events:auto; width:2em; height:2em;
    display:grid; place-items:center; color:var(--dim); font-size:1em;
    border:1px solid var(--line); background:rgba(10,31,46,.7); border-radius:2px}
  .mute:hover{color:var(--foam)}
  @media (max-width:640px){
    .lvbar{width:40%}
    .stats{max-width:52%}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="game" width="480" height="270"></canvas>

    <div id="hud">
      <div class="topbar">
        <div class="clock" id="clock">
          <span class="k" id="lblTime">ノコリ</span><span class="v num" id="time">3:00</span>
        </div>
        <div class="catch">
          <span class="k" id="lblCatch">ギョカク</span>
          <span class="v disp num" id="score">0</span><span class="u" id="lblCatchUnit">本</span>
        </div>
      </div>

      <div class="lvbar">
        <div class="row"><span id="lvlabel">NEXT</span><span class="num" id="lvnum">0 / 9</span></div>
        <div class="track"><div class="fill" id="lvfill"></div></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="sonar">
        <canvas id="radar" width="340" height="340"></canvas>
      </div>

      <div class="fvbadge" id="fvbadge"><span class="fvbar" id="fvbar"></span><b id="fvlabel">入れ食い</b><em class="num" id="fvround">1連</em><i class="num" id="fvchain">0</i></div>
      <div class="fvbig disp" id="fvbig">入れ食い</div>

      <div class="toast" id="toast"><div class="hd">宝箱</div><div id="toastitems"></div></div>
    </div>

    <div class="fever" id="fever"></div>
    <button class="mute" id="mute" title="音">♪</button>
    <div id="perfwrap"><div id="perf" hidden></div></div>

    <div class="prompt" id="prompt">
      <div class="pTop">
        <h1 class="disp"><span id="h1a">カツオ</span><em id="h1b">一本釣り</em></h1>
        <div class="tsub" id="h1sub"></div>
      </div>
      <div class="pBottom">
        <p class="tap" id="tapHint">動かして出港</p>
        <div class="best" id="titlebest"></div>
      </div>
    </div>

    <div class="scrim" id="levelup">
      <div class="box">
        <div class="lvhd" id="lblPickEyebrow">タイリョウ</div>
        <div class="lvsub disp" id="lblPickHead">どれを積む？</div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div class="scrim" id="result">
      <div class="box">
        <div class="rhd" id="lblResHead">リョウ シュウリョウ</div>
        <div class="score disp num" id="rscore">0<span>本</span></div>
        <div class="rank" id="rrank"></div>
        <div class="grow num" id="rgrow"></div>
        <div id="rbestwrap"></div>
        <div class="rrow" id="rstats"></div>
        <button class="go disp" id="retry">もう一度</button>
        <div class="best" id="rbest"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   カツオ一本釣り  —  3分スコアアタック
   船を動かすだけ。釣りは自動。一定本数ごとにランダム3択で強化。
   アセットは全てコード生成のピクセルアート（外部画像なし）。
   ============================================================ */

const VW = 480, VH = 270;                 // 内部解像度（ピクセルアート基準）
const M_PER_PX = 2;                       // 魚探の距離表示用（1px = 2m）
const GAME_TIME = 180;

/* ================= 文言 ================= */
const STR={
ja:{
 'title.h1a':'カツオ','title.h1b':'一本釣り','title.sub':'',
 'title.tap':'動かして出港','title.best':'自己ベスト {n}本',
 'hud.time':'ノコリ','hud.catch':'ギョカク','hud.catchUnit':'本','hud.next':'NEXT',
 'hud.fever':'入れ食い','hud.round':'{n}連',
 'pick.eyebrow':'タイリョウ','pick.head':'どれを積む？',
 'up.crew.name':'漁師','up.crew.short':'漁師','up.crew.fl':'漁師が3人増える。釣り座が空いていなければ待機に回る。',
 'up.hull.name':'船体','up.hull.short':'船体','up.hull.fl':'船が大きくなり、釣り座と漁獲範囲が広がる。',

  if(p) for(const n in p) v=v.split('{'+n+'}').join(p[n]);
  return v;
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
function gx(c){const g=c.getContext('2d');g.imageSmoothingEnabled=false;return g;}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function line(g,x0,y0,x1,y1,c,th){ // 整数ピクセルの直線
  th=th||1; const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx-dy, x=x0, y=y0;
  g.fillStyle=c;
  for(let i=0;i<200;i++){ g.fillRect(x,y,th,th);
    if(x===x1&&y===y1)break; const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;} if(e2<dx){err+=dx;y+=sy;} }
}

/* ---------------- カツオ（極小スプライト＋回転アトラス） ---------------- */
const FISH_MAP=[
  '#.....####...',
  '##..#########',
  '#############',
  '##..#########',
  '#.....####...'
];
const FISH_PAL=[
  ['#2f739c','#12466a','#0c3752','#12466a','#2b6b91'],
  ['#245f84','#0f3c5c','#0a3048','#0f3c5c','#215a7d'],
  ['#1a4d6c','#0d3450','#092a40','#0d3450','#184868']
];
const FISH_ALPHA=[1,.88,.6], FISH_SCALE=[1,.92,.78];
/* 釣り上げられて空中にいるカツオ。水中用とは用途が違うので別に持つ。
   真上から見た暗い背中ではなく、横向きで腹の銀色が出る絵にする。 */
const AIR_MAP=[
  '.....####....',
  '#...#########',
  '##.##########',
  '##.##########',
  '#...#########',
  '.....####....'
];
const AIR_PAL=['#1b4665','#275d84','#5798c2','#b7dcef','#f4fafd','#d2e4ef'];
const ANG=24, CELL=16;   // 13x5 の回転に必要なのは13.9px。余白を詰めて合成面積を減らす
let fishAtlas=null;

function fishBase(d){
  const w=13,h=5, pal=FISH_PAL[d];
  const c=mkc(w,h), g=gx(c);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(FISH_MAP[y][x]!=='#') continue;
    px(g,x,y,1,1,pal[y]);
  }
  if(d<2){                             // 背のツヤと両目
    px(g,9,2,3,1, d===0?'#4291b9':'#2c6f95');
    px(g,11,1,1,1,'#06202f'); px(g,11,3,1,1,'#06202f');
  }
  const s=FISH_SCALE[d];
  if(s===1) return c;
  const w2=Math.max(6,Math.round(w*s)), h2=Math.max(3,Math.round(h*s));
  const c2=mkc(w2,h2), g2=gx(c2); g2.drawImage(c,0,0,w2,h2); return c2;
}
function fishAir(){
  const w=13,h=6, c=mkc(w,h), g=gx(c);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++)
    if(AIR_MAP[y][x]==='#') px(g,x,y,1,1,AIR_PAL[y]);
  px(g,7,3,1,1,'#8fc0dc'); px(g,9,3,1,1,'#8fc0dc');   // 体側の縞
  px(g,10,1,1,1,'#0a2233');                            // 目
  px(g,12,2,1,2,'#e8f4fb');                            // 口先の照り返し
  return c;
}
function buildFishAtlas(){
  fishAtlas=mkc(CELL*ANG, CELL*4);
  const g=gx(fishAtlas);
  for(let d=0;d<4;d++){
    const base=d<3?fishBase(d):fishAir();
    for(let a=0;a<ANG;a++){
      g.save();
      g.globalAlpha=d<3?FISH_ALPHA[d]:1;
      g.translate(a*CELL+CELL/2, d*CELL+CELL/2);
      g.rotate(a/ANG*TAU);
      g.drawImage(base, -base.width/2, -base.height/2);   // 丸めるとセル中心から0.5pxずれて端が欠ける
      g.restore();
    }
  }
}

/* ---------------- 漁船（Lv1〜Lv5・独立生成） ---------------- */
const HULL_LEN=[52,68,88,112,144];
const SEAT_GAP=8;
const boats=[];

function buildBoat(lv){
  const len=HULL_LEN[lv-1];
  const W=len+14, H=46, railY=22, waterY=34;
  const c=mkc(W,H), g=gx(c);
  const x0=5, x1=W-5;
  const top=[], bot=[];
  for(let x=x0;x<=x1;x++){
    let t=railY, b=waterY+3;
    const fb=(x-(x1-16))/16;                    // 船首側の反り
    if(fb>0) t-=Math.round(4*fb*fb);
    const fs=((x0+10)-x)/10;                    // 船尾側
    if(fs>0) t-=Math.round(2*fs*fs);
    const e=Math.min((x-x0)/4,(x1-x)/6,1);      // 前後の絞り
    b-=Math.round((1-e)*6);
    if(b<=t) b=t+1;
    top[x]=t; bot[x]=b;
    px(g,x,t,1,b-t,'#000');
  }
  g.globalCompositeOperation='source-atop';
  px(g,0,0,W,railY+5,'#e9f0f3');                // 白い外板
  px(g,0,railY+5,W,2,'#d8322a');                // 朱の帯
  px(g,0,railY+7,W,H,'#15455f');                // 喫水下
  px(g,0,waterY,W,H,'#0e3149');
  g.globalCompositeOperation='source-over';
  for(let x=x0;x<=x1;x++){
    px(g,x,top[x],1,1,'#7c98a8');               // 船べりのハイライト
    px(g,x,bot[x]-1,1,1,'#08202f');
  }
  // 舷側の細部
  for(let x=x0+14;x<x1-8;x+=13){ px(g,x,railY+9,3,3,'#0b2b3d'); px(g,x+1,railY+9,1,1,'#123b52'); }
  px(g,x1-14,railY+2,10,2,'#c2ced5');
  // 操舵室（船尾）
  const wh=[10,12,14,16,18][lv-1], hh=[9,11,12,14,16][lv-1], wx=x0+5;
  px(g,wx,railY-hh,wh,hh,'#eef4f6');
  px(g,wx,railY-hh,wh,1,'#b9c7cf');
  px(g,wx,railY-1,wh,1,'#9fb0ba');
  for(let i=0;i<Math.floor(wh/4);i++) px(g,wx+2+i*4,railY-hh+3,2,3,'#123b52');
  px(g,wx-1,railY-hh-1,wh+2,1,'#d8322a');       // 屋根の朱線
  // マストと大漁旗
  const mx=wx+wh-2, my=railY-hh-1;
  px(g,mx,my-9,1,9,'#8a6a3f');
  px(g,mx+1,my-9,5,3,'#d8322a');
  px(g,mx+1,my-6,4,2,'#f2b32c');
  if(lv>=3){ px(g,mx-4,my-6,3,2,'#cfd9de'); px(g,mx-3,my-4,1,3,'#8a6a3f'); }
  if(lv>=4){ px(g,wx+wh+2,railY-5,6,5,'#dbe4e8'); px(g,wx+wh+3,railY-4,4,1,'#123b52'); }
  if(lv>=5){ px(g,x1-24,railY-4,7,4,'#dbe4e8'); px(g,x1-23,railY-3,5,1,'#123b52'); }
  // 釣り座
  const seatX=[];
  for(let x=x0+13; x<=x1-14; x+=SEAT_GAP) seatX.push(x);
  return {cv:c,W,H,railY,waterY,seatX,len};
}

/* ---------------- 漁師（2頭身・下半身なし・竿と糸を一体化） ---------------- */
const FPAL=[
  {shirt:'#22536f',shirt2:'#173c53',hat:'#d9b160',skin:'#e2a878',band:null},
  {shirt:'#c86a2c',shirt2:'#9a4f1e',hat:null,skin:'#d69a6b',band:'#e0332c'},
  {shirt:'#e3ebef',shirt2:'#b9c6cd',hat:'#1d4a68',skin:'#e8b98a',band:null}
];
const fishers=[[],[]];   // [row][pose] -> [palette]

function buildFisher(pi,row,pose){
  const W=24,H=34, c=mkc(W,H), g=gx(c);
  const p=FPAL[pi];
  const by = row===0 ? 17 : 26;          // 腰の切断面（near/far で位置を変える）
  const hy = by-15;                      // 頭の上端
  const cx = 7;
  // 頭
  px(g,cx-3,hy+1,7,6,p.skin);
  px(g,cx-2,hy,5,1,p.skin);
  px(g,cx+2,hy+3,1,1,'#3a2418'); px(g,cx,hy+3,1,1,'#3a2418');
  if(p.hat){ px(g,cx-5,hy+1,11,1,p.hat); px(g,cx-3,hy-1,7,2,p.hat); px(g,cx-3,hy+1,7,1,'#00000033'); }
  else if(p.band){ px(g,cx-3,hy+1,7,2,p.band); px(g,cx+3,hy+1,3,1,p.band); }
  // 胴（短い）
  px(g,cx-3,by-8,7,8,p.shirt);
  px(g,cx-3,by-8,7,1,p.shirt2);
  px(g,cx-3,by-2,7,2,p.shirt2);
  // 腕と竿
  let ax0,ay0,tx,ty;
  if(pose===0){
    if(row===0){ ax0=cx+4; ay0=by-6; tx=21; ty=by+13; }
    else       { ax0=cx+4; ay0=by-7; tx=21; ty=by-19; }
  }else{
    ax0=cx+5; ay0=by-11; tx=22; ty=by-(row===0?16:24);
  }
  px(g,cx+3,ay0-1,3,3,p.skin);                       // 手
  px(g,cx+1,ay0-2,3,4,p.shirt);                      // 腕
  if(pose===1) px(g,cx+1,ay0-3,3,4,p.shirt);
  line(g,ax0,ay0,tx,ty,'#caa268');                   // 一本釣り竿（リールなし）
  line(g,ax0+1,ay0,tx,ty-1,'#8f6f42');
  const lx=tx, ly=ty;
  if(pose===0){                                      // 糸の出だしだけ。続きは水中側で動的に描く
    const dy = row===0? 2 : -2;
    line(g,lx,ly,lx,ly+dy,'#cfdde6');
  }
  if(row===1){                                       // 向こう舷は沈める
    g.globalCompositeOperation='source-atop';
    px(g,0,0,W,H,'rgba(4,32,52,.34)');
    g.globalCompositeOperation='source-over';
  }
  return {cv:c, ax:cx, ay:by, tip:{x:lx-cx, y:ly-by}};
}

const flagCv=[];

  for(let f=0;f<4;f++){

    const ph=f/4*TAU;
    px(g,0,1,1,10,'#6b4a26');                        // 竿
    px(g,0,0,1,1,'#f2b32c');
    for(let x=0;x<11;x++){                           // 旗はサインで波打たせる
      const y=1+Math.round(Math.sin(ph+x*0.62)*1.4)+1;
      px(g,1+x,y,1,2,'#e0332c');

      px(g,1+x,y+3,1,1,'#eaf3f4');
      if(x===0) px(g,1,y,1,4,'#a81d18');
    }
    flagCv.push(c);
  }
}

let popNorm=null, popFv=null;
function buildPop(){
  const rects=[[2,3,3,1],[3,2,1,3],[6,1,1,5],[5,2,1,1],[5,5,3,1]];   // + と 1
  const mk=(col)=>{
    const c=mkc(9,7), g=gx(c);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){            // 海に埋もれないよう縁取り
      if(!dx&&!dy) continue;
      for(const r of rects) px(g,r[0]+dx,r[1]+dy,r[2],r[3],'#0a2233');
    }
    for(const r of rects) px(g,r[0],r[1],r[2],r[3],col);
    return c;
  };
  popNorm=mk('#ffffff'); popFv=mk('#ff5a4a');
}

  for(let i=0;i<5;i++){ const x=rint(0,T-3), y=rint(0,T-1);
    px(g,x,y,rint(1,3),1,'rgba(228,244,250,.22)'); }
}

/* ---------------- 強化定義 ---------------- */
const UPG=[
  {id:'crew', max:99, lv:()=>S.up.crew, apply:()=>{S.up.crew+=3;}},
  {id:'hull', max:5, lv:()=>S.up.hull, apply:()=>{S.up.hull=Math.min(5,S.up.hull+1);}},
  {id:'rate', max:10, lv:()=>S.up.rate, apply:()=>{S.up.rate++;}},
  {id:'engine', max:10, lv:()=>S.up.engine, apply:()=>{S.up.engine++;}},
  {id:'sonar', max:6, lv:()=>S.up.sonar, apply:()=>{S.up.sonar++;}},
  {id:'lure', max:8, lv:()=>S.up.lure, apply:()=>{S.up.lure++;}}
];
const UPG_BY={}; UPG.forEach(u=>UPG_BY[u.id]=u);
const ICONS={};

/* ---------------- 状態 ---------------- */
const S={
  mode:'play', started:false, t:0, score:0, best:0, level:1, need:9, prog:0,
  boat:{x:0,y:0,vx:0,vy:0,hd:0,sp:0,face:1,bob:0},
  stick:{id:-1, on:false, ax:0, ay:0, tx:0, ty:0, f:0},
  dir:{x:0,y:0}, aim:{x:0,y:0},
  schools:[], chests:[], crew:[], parts:[], wake:[], rings:[], spray:[], flash:[],
  up:{crew:2,hull:1,rate:0,engine:0,sonar:1,lure:1},
  seatX:[], seats:0, chestT:26, sprayAcc:0, start:{crew:2,hull:1,rate:0,engine:0,sonar:1,lure:1}, totalFish:0, choices:[], caught:0,
  rt:0, shake:0, freeze:0, pop:0, pops:[], burst:null, inRange:0, fvIdle:0,
  fvT:0, fvRound:0, fvLock:0, fvPulse:0, fever:false, chain:0
};
const TONS=[9,19,49,119,199];
/* 入れ食い＝大群に当たったとき。
   この海は「群れの中か外か」の二値で、中に居る時間が全体の8割ある。
   釣れ高でも連続時間でも峰が立たない（どちらで判定しても常時発動になる）ので、
   状態検出はやめて「その時間帯の湧き量の上限に近い群れに入った」ことを引き金にする。
   魚探で大きい反応を選ぶ意味がここで出る。 */
/* 入れ食いはパチンコ式。1本釣るごとに突入抽選、1ラウンドごとに継続抽選。
   大きい群れほど抽選回数が増えるので、狙いに行く意味は確率として残る。 */
const FV_ENTRY=0.006;                // 1本あたりの突入確率
const FV_LOCK=4;                     // 終了後この秒数は突入抽選をしない
const FV_MINFISH=45;                 // 竿の下にこれだけ魚がいないと突入しない（群れの尻尾で当たらないように）
const FV_DRY=1.5;                    // これだけ釣れない時間が続いたら入れ食いは切れる
const FV_ROUND=6;                    // 1ラウンドの長さ（秒）
const FV_CONT=0.68;                  // ラウンド終わりの継続確率。期待 1/(1-C) ラウンド
const FV_RATE=1.1;                   // 入れ食い中の釣り速度の倍率。ここだけがスコアに効く
const FV_STOP=0.12;                  // 突入の瞬間に世界を止める秒数
let REDUCE=false;
try{ REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
const stat = {
  rate:(u)=>1.25*Math.pow(1.18,(u||S.up).rate),
  speed:(u)=>{u=u||S.up; return 52*Math.pow(1.12,u.engine)*(1+0.045*(u.hull-1));},
  turn:(u)=>{u=u||S.up; return 5.0*Math.pow(1.10,u.engine)*(1-0.03*(u.hull-1));},
  sonar:(u)=>250*Math.pow(1.32,(u||S.up).sonar-1),
  lureR:(u)=>{u=u||S.up; return u.lure===0?0:150+70*u.lure;},
  lureF:()=>S.up.lure*3.4,
  seats:(u)=>boats[(u||S.up).hull-1].seatX.length*2,
  power:(u)=>{u=u||S.up; return Math.min(u.crew,stat.seats(u))*stat.rate(u);},
  rx:()=>HULL_LEN[S.up.hull-1]/2+24,
  ry:()=>42
};
/* 表示は Lv ではなく実数で。漁師=稼働/総数、船体=最大乗船人数、魚探と集魚=初期比 */
const SONAR_BASE=250, LURE_BASE=220;
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(2)+t('unit.km') : Math.round(m)+t('unit.m'); }
function valOf(id,u){
  let r={n:'',u:''};
  switch(id){
    case 'crew': {
      const s0=stat.seats(u), act=Math.min(u.crew,s0), cap=u.crew>=s0;
      r={n:u.crew+'/'+act, h:u.crew+'/'+(cap?'<span class="cap">'+act+'</span>':act), u:t('unit.crew'), cap};
      break;
    }
    case 'hull':   r={n:String(stat.seats(u)), u:t('unit.crew')}; break;
    case 'rate':   r={n:stat.rate(u).toFixed(2), u:t('unit.rate')}; break;
    case 'engine': r={n:(stat.speed(u)*0.25).toFixed(1), u:t('unit.knot')}; break;
    case 'sonar':  r={n:'+'+Math.round((stat.sonar(u)/SONAR_BASE-1)*100)+'%', u:''}; break;
    case 'lure':   r = u.lure===0 ? {n:t('unit.none'), u:''}
                     : {n:'+'+Math.round((stat.lureR(u)/LURE_BASE-1)*100)+'%', u:''}; break;
  }
  if(!r.h) r.h=r.n;
  return r;
}
function nextUp(id){
  const u=Object.assign({},S.up);
  if(id==='crew') u.crew+=3;
  else if(id==='hull') u.hull=Math.min(5,u.hull+1);
  else u[id]++;
  return u;
}
function loadBest(){ try{return parseInt(localStorage.getItem('ippon.best')||'0',10)||0;}catch(e){return 0;} }
function saveBest(v){ try{localStorage.setItem('ippon.best',String(v));}catch(e){} }
</script>

<script>
"use strict";
/* ================= アセット構築 ================= */
function initAssets(){
  buildFishAtlas(); buildSea(); buildChest(); buildPop(); buildFlag();
  for(let lv=1;lv<=5;lv++) boats.push(buildBoat(lv));
  for(let r=0;r<2;r++){ fishers[r]=[[],[]];
    for(let p=0;p<2;p++) for(let i=0;i<3;i++) fishers[r][p][i]=buildFisher(i,r,p); }
  UPG.forEach(u=>ICONS[u.id]=buildIcon(u.id));
}

/* ================= 魚群 ================= */
const schoolRadius=n=>Math.min(140,Math.sqrt(n)*5.0);   // 上限で頭打ちにして、大群ほど密にする
const PSTEP=4, PN=104;            // 先頭の軌跡を4px刻みで416pxぶん保持する
/* 表に出さない副効果の係数（1レベルあたり） */
const TUNE={ lureSchoolSize:0.12, sonarChestRate:0.15 };
function makeSchool(x,y,count){
  const rx=schoolRadius(count), ry=rx*0.6;
  const ang=rnd(0,TAU), ca=Math.cos(ang), sa=Math.sin(ang);
  const hx=x+ca*rx, hy=y+sa*rx;   // x,y は群れの胴体中心。先頭はその前方
  const s={x:hx, y:hy, cx:x, cy:y, ca:ang, ang, hd:ang, sp:rnd(9,18), rx, ry,
    turn:0, k:1, pulse:rnd(0,TAU), pi:0, pfrac:0,
    path:new Float32Array(PN*5), alive:count, n0:count, fish:new Array(count)};
  for(let i=0;i<PN;i++){                       // 初期軌跡はまっすぐ後ろへ
    const b=(((0-i)%PN)+PN)%PN*5;
    s.path[b]=hx-ca*i*PSTEP; s.path[b+1]=hy-sa*i*PSTEP;
    s.path[b+2]=ca; s.path[b+3]=sa; s.path[b+4]=ang;
  }
  for(let i=0;i<count;i++){
    const a=rnd(0,TAU), u=Math.pow(Math.random(),0.72), r=Math.random();   // 0.5が一様。大きいほど中心が濃い
    const ox=Math.cos(a)*u*rx;
    s.fish[i]={d:rx-ox, oy:Math.sin(a)*u*ry,      // d=先頭からの弧長距離
      dd:(r<.3?2:(r<.66?1:0)),
      ph:rnd(0,TAU), ps:rnd(2.2,4.4), alive:true, wx:hx, wy:hy, a:ang};
  }
  s.fish.sort((p,q)=>q.dd-p.dd);
  return s;
}
function manageWorld(dt){
  const B=S.boat, p=S.t/GAME_TIME;
  const target=14+Math.floor(p*10), DESP=1000;
  for(let i=S.schools.length-1;i>=0;i--){
    const s=S.schools[i];
    if(s.alive<=0 || Math.hypot(s.cx-B.x,s.cy-B.y)>DESP){ S.totalFish-=s.alive; S.schools.splice(i,1); }
  }
  let guard=0;
  const cap=20000*(1+TUNE.lureSchoolSize*(S.up.lure-1));  // 終盤は海を埋める。集魚のぶん更に上げる
  while(S.schools.length<target && S.totalFish<cap && guard++<6){
    const q=p*p;   // 規模は後半で一気に伸ばす。序盤は小さい群れを次々に乗り換えるテンポを優先
    const n=Math.round(rnd(50+q*850, 150+q*1450)*(1+TUNE.lureSchoolSize*(S.up.lure-1)));  // 隠し効果：集魚で群れが大きくなる
    // 湧き距離は群れの中心ではなく「手前側の縁」で測る。
    // 半径を足さないと、大きい群れほど画面の中に身体がはみ出して出現する
    const a=rnd(0,TAU), d=schoolRadius(n)+rnd(290,520);
    S.schools.push(makeSchool(B.x+Math.cos(a)*d, B.y+Math.sin(a)*d, n));
    S.totalFish+=n;
  }
  if(S.mode!=='play' || !S.started) return;
  S.chestT-=dt;
  if(S.chestT<=0){
    const sn=S.up.sonar;
    S.chestT=rnd(24,34)/(1+TUNE.sonarChestRate*(sn-1));   // 隠し効果：魚探で宝箱が見つかりやすくなる
    if(S.chests.length<2+((sn-1)>>1)){
      const a=rnd(0,TAU), d=rnd(300,560);
      S.chests.push({x:B.x+Math.cos(a)*d, y:B.y+Math.sin(a)*d, life:52, ph:rnd(0,TAU)});
    }
  }
  for(let i=S.chests.length-1;i>=0;i--){
    const c=S.chests[i]; c.life-=dt; c.ph+=dt*2;
    if(c.life<=0 || Math.hypot(c.x-B.x,c.y-B.y)>DESP){ S.chests.splice(i,1); continue; }
    if(Math.hypot(c.x-B.x,c.y-B.y)<36){ S.chests.splice(i,1); openChest(); }
  }
}
function updateSchools(dt){
  const B=S.boat, lr=stat.lureR(), lf=stat.lureF();
  for(const s of S.schools){
    s.turn=clamp(s.turn+rnd(-1,1)*dt*2.6,-0.7,0.7);
    s.ang+=s.turn*dt;
    s.pulse+=dt*1.7;
    const sp=s.sp*(1+0.18*Math.sin(s.pulse));
    let tx=Math.cos(s.ang), ty=Math.sin(s.ang), react=0;
    const dx=B.x-s.cx, dy=B.y-s.cy, di=Math.hypot(dx,dy)||1;
    if(lr>0 && di<lr){                          // 集魚：船の方へ舵を切らせる
      const w=lf/12*(1-di/lr);
      tx+=dx/di*w; ty+=dy/di*w; react=Math.max(react,Math.min(1,w/1.4));
    }
    if(di<78){                                  // 逃走：少しだけ進路を変える程度に留める
      const w=1.3*(1-di/78);
      tx-=dx/di*w; ty-=dy/di*w; react=Math.max(react,Math.min(0.35,w));  // 角速度は上げすぎない（周回防止）
    }
    let dh=Math.atan2(ty,tx)-s.hd;
    while(dh>Math.PI) dh-=TAU;
    while(dh<-Math.PI) dh+=TAU;
    // 旋回半径が群れの大きさを下回らないよう角速度を抑える。
    // ただし船に反応しているときは強く曲がってよい
    const wmax=sp/(40+s.rx*1.2)*(1+react*5);
    s.hd+=clamp(dh,-wmax*dt,wmax*dt);
    const c0=Math.cos(s.hd), s0=Math.sin(s.hd);
    s.x+=c0*sp*dt; s.y+=s0*sp*dt;               // 動くのは先頭だけ
    s.pfrac+=sp*dt;
    while(s.pfrac>=PSTEP){                      // 4px進むごとに軌跡を1点刻む
      s.pfrac-=PSTEP; s.pi=(s.pi+1)%PN;
      const b=s.pi*5;
      s.path[b]=s.x; s.path[b+1]=s.y; s.path[b+2]=c0; s.path[b+3]=s0; s.path[b+4]=s.hd;
    }
    const kt=0.28+0.72*Math.sqrt(s.alive/s.n0);
    s.k+=(kt-s.k)*Math.min(1,dt*0.8);
    const k=s.k, P=s.path, pi=s.pi, pf=s.pfrac;
    {                                           // 胴体の中心（判定・影・魚探はここを使う）
      const t=(s.rx*k-pf)/PSTEP;
      const i0=Math.min(PN-2,Math.max(0,t|0)), fr=t-i0;
      const A=(((pi-i0)%PN)+PN)%PN*5, Bb=(((pi-i0-1)%PN)+PN)%PN*5;
      s.cx=P[A]+(P[Bb]-P[A])*fr; s.cy=P[A+1]+(P[Bb+1]-P[A+1])*fr; s.ca=P[A+4];
    }
    const fs=s.fish;   // 魚探に実位置で映すため、画面外の群れも位置を更新する
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      f.ph+=f.ps*dt;
      const w=Math.sin(f.ph);
      const t=(f.d*k+w*2.2-pf)/PSTEP;           // 先頭から何px後ろの軌跡上にいるか
      // t<0 は最新サンプルより前方。i0=0 のまま fr を負にして外挿する
      const i0=Math.min(PN-2,Math.max(0,t|0)), fr=t-i0;
      const A=(((pi-i0)%PN)+PN)%PN*5, Bb=(((pi-i0-1)%PN)+PN)%PN*5;
      const x=P[A]+(P[Bb]-P[A])*fr, y=P[A+1]+(P[Bb+1]-P[A+1])*fr;
      const c=P[A+2]+(P[Bb+2]-P[A+2])*fr, sn=P[A+3]+(P[Bb+3]-P[A+3])*fr;
      const oy=f.oy*k+w*1.3;
      f.wx=x-sn*oy; f.wy=y+c*oy;                // 軌跡の法線方向へ横オフセット
      f.a=P[A+4]+w*0.24;
    }
  }
}

/* ================= 乗組員 ================= */
function layoutCrew(){
  const b=boats[S.up.hull-1];
  S.seats=b.seatX.length*2;
  const onboard=Math.min(S.up.crew,S.seats);
  while(S.crew.length<onboard) S.crew.push({pal:rint(0,2), cd:rnd(0,.7), pose:0, pt:0, row:0, si:0,
    lineLen:rint(8,13), lineSlant:rnd(-2.4,2.4)});
  while(S.crew.length>onboard) S.crew.pop();
  const order=[], ns=b.seatX.length, mid=(ns-1)/2;
  const byCenter=[];
  for(let i=0;i<ns;i++) byCenter.push(i);
  byCenter.sort((a,c)=>Math.abs(a-mid)-Math.abs(c-mid));
  for(const i of byCenter){ order.push([0,i]); order.push([1,i]); }
  for(let k=0;k<S.crew.length;k++){ S.crew[k].row=order[k][0]; S.crew[k].si=order[k][1]; }
  placeCrew();
}
function placeCrew(){
  const b=boats[S.up.hull-1], f=S.boat.face;
  for(const fm of S.crew){
    fm.lx=b.seatX[fm.si]-b.W/2 + (fm.row===1?4:0);
    fm.ly=(fm.row===0?b.railY:b.railY+2)-b.waterY;
    const sp=fishers[fm.row][fm.pose][fm.pal];
    fm.wx=f<0?-fm.lx:fm.lx;
    fm.tipx=f<0?-(fm.lx+sp.tip.x):(fm.lx+sp.tip.x);
    fm.tipy=fm.ly+sp.tip.y;
  }
}

/* ================= 漁 ================= */
function updateFishing(dt){
  const B=S.boat, rx=stat.rx(), ry=stat.ry(), rate=stat.rate()*(S.fever?FV_RATE:1);
  const up=[], dn=[];
  for(const s of S.schools){
    if(Math.abs(s.cx-B.x)>rx+s.rx*s.k+14 || Math.abs(s.cy-B.y)>ry+s.rx*s.k+14) continue;
    const fs=s.fish;
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      const ex=(f.wx-B.x)/rx, ey=(f.wy-B.y)/ry;
      if(ex*ex+ey*ey<=1) (f.wy<B.y?up:dn).push({f,s});
    }
  }
  S.inRange=up.length+dn.length;                // 竿の下に今いる魚。入れ食いの判定に使う
  for(const fm of S.crew){
    if(fm.pose===1){ fm.pt-=dt; if(fm.pt<=0){ fm.pose=0; } }
    fm.cd-=dt;
    if(fm.cd>0) continue;
    const own=fm.row===1?up:dn, other=fm.row===1?dn:up;
    const src=own.length?own:other;
    if(!src.length){ fm.cd=rnd(.03,.12); continue; }
    const fx=B.x+fm.wx;
    let bi=0, bd=1e9;
    for(let i=0;i<src.length;i++){
      const o=src[i], d=Math.abs(o.f.wx-fx)+Math.abs(o.f.wy-B.y)*0.55;
      if(d<bd){ bd=d; bi=i; }
    }
    const o=src[bi]; src.splice(bi,1);
    doCatch(fm,o);
    fm.cd=(1/rate)*rnd(.82,1.18);
    if(S.mode!=='play') return;
  }
}
function doCatch(fm,o){
  o.f.alive=false; o.s.alive--; S.totalFish--; S.score++; S.prog++;
  fm.pose=1; fm.pt=.28; placeCrew();
  S.parts.push({x:o.f.wx, y:o.f.wy, x0:o.f.wx, y0:o.f.wy, t:0, dur:.28, a:o.f.a, d:o.f.dd, fm});
  S.rings.push({x:o.f.wx, y:o.f.wy, t:0});
  S.pop=1;                                       // ギョカクの数字を弾ませる
  S.fvIdle=0;
  if(S.fever) S.chain++;
  else if(S.fvLock<=0 && S.inRange>=FV_MINFISH && Math.random()<FV_ENTRY) feverOn();   // 1本ごとの突入抽選
  sfxCatch();
  if(S.prog>=S.need) levelUp();
}

/* ================= 入れ食い ================= */
function feverOn(){
  S.fever=true; S.fvT=FV_ROUND; S.fvRound=1; S.fvPulse=1; S.chain=1;
  S.freeze=FV_STOP;                              // 一瞬だけ世界を止める
  sfxFever(); bang('fever');
  elFvBig.classList.remove('go'); void elFvBig.offsetWidth; elFvBig.classList.add('go');
  clearTimeout(feverOn._t);
  feverOn._t=setTimeout(()=>elFvBig.classList.remove('go'),1150);
}
function updateFever(dt){
  if(S.fvLock>0) S.fvLock-=dt;
  S.fvIdle+=dt;
  if(!S.fever) return;
  if(S.fvIdle>FV_DRY){                           // 魚が切れたら入れ食いも切れる
    S.fever=false; S.fvT=0; S.fvLock=FV_LOCK; elFvBadge.style.transform='';
    return;
  }
  S.fvT-=dt;
  if(S.fvT>0) return;
  if(Math.random()<FV_CONT){                     // 継続。ここがこのモードの山場
    S.fvRound++; S.fvT=FV_ROUND; S.fvPulse=1;
    bang('cont'); sfxCont();
  }else{
    S.fever=false; S.fvT=0; S.fvLock=FV_LOCK;   // 終わりは無音。通常に戻るだけ
    elFvBadge.style.transform='';
  }
}
function bang(kind){                             // 決定的な瞬間の閃光と揺れ
  const big=kind==='fever';
  S.burst={t:0, dur:big?.7:(kind==='cont'?.34:(kind==='chest'?.55:.45)), kind, seed:rnd(0,TAU)};
  S.shake=Math.min(big?1.35:1, S.shake+(big?1.35:(kind==='cont'?.45:(kind==='chest'?.8:1))));
}

/* ================= 強化 ================= */
function rollChoices(){
  const pool=UPG.filter(u=>u.lv()<u.max), out=[];
  while(out.length<3 && pool.length) out.push(pool.splice(rint(0,pool.length-1),1)[0]);
  while(out.length<3) out.push(UPG_BY.crew);
  return out;
}
function levelUp(){
  S.prog-=S.need; S.level++;
  S.need=Math.round(9*Math.pow(1.28,S.level-1));
  S.mode='levelup';
  S.choices=rollChoices();
  bang('lv'); sfxLevel();
  clearTimeout(levelUp._t);                      // 閃光を見せてからカードを開く
  levelUp._t=setTimeout(()=>{ if(S.mode==='levelup') showCards(); }, 340);
}
function applyUpgrade(u){ u.apply(); layoutCrew(); }
function openChest(){
  const n = Math.random()<.70?1:(Math.random()<.73?3:5);
  const got=[];
  for(let i=0;i<n;i++){
    const pool=UPG.filter(u=>u.lv()<u.max);
    const u=pool.length?pick(pool):UPG_BY.crew;
    u.apply(); got.push(t('up.'+u.id+'.name'));
  }
  layoutCrew(); bang('chest'); sfxChest();
  const counts={};
  got.forEach(g=>counts[g]=(counts[g]||0)+1);
  toastEl.querySelector('.hd').textContent = t(n===5?'chest.5':(n===3?'chest.3':'chest.1'));
  toastItems.innerHTML='';
  Object.keys(counts).forEach(k=>{
    const d=document.createElement('div'); d.className='it';
    d.textContent = counts[k]>1 ? t('chest.itemN',{name:k,n:counts[k]}) : t('chest.item',{name:k});
    toastItems.appendChild(d);
  });
  toastEl.classList.add('on');
  clearTimeout(openChest._t);
  openChest._t=setTimeout(()=>toastEl.classList.remove('on'),2600);
}

/* ================= 船 ================= */
function updateBoat(dt){
  const B=S.boat, sp=stat.speed();
  let tx=0,ty=0;
  tx=S.dir.x; ty=S.dir.y;
  const want=Math.hypot(tx,ty);
  const cruise=sp;
  if(want>0){                             // 船首方位は最小旋回半径に縛られる
    let dh=Math.atan2(ty,tx)-B.hd;
    while(dh>Math.PI) dh-=TAU;
    while(dh<-Math.PI) dh+=TAU;
    const wmax=stat.turn()*(0.6+0.4*Math.min(1,B.sp/Math.max(1,sp)));   // 停船中はやや舵が鈍る
    B.hd+=clamp(dh,-wmax*dt,wmax*dt);
  }
  const target=want>0?cruise:0;           // 推力は船首方向のみ。横滑りはしない
  B.sp+=(target-B.sp)*(1-Math.pow(0.018,dt));
  B.vx=Math.cos(B.hd)*B.sp; B.vy=Math.sin(B.hd)*B.sp;
  B.x+=B.vx*dt; B.y+=B.vy*dt;
  if(Math.abs(B.vx)>4) B.face=B.vx>0?1:-1;
  B.bob+=dt*2.4;
  placeCrew();
  // 航跡
  const spd=Math.hypot(B.vx,B.vy);
  if(spd>8 && Math.random()<dt*38){
    const b=boats[S.up.hull-1], back=-B.face*(b.len/2);
    S.wake.push({x:B.x+back+rnd(-4,4), y:B.y+rnd(-2,3), t:0, r:rnd(1,2.4)});
  }
  // 散水（活餌を撒く仕掛け）
  S.sprayAcc+=S.crew.length*6*dt;
  let n=Math.min(6,Math.floor(S.sprayAcc));
  S.sprayAcc-=n;
  while(n-->0 && S.crew.length){
    const fm=pick(S.crew);
    S.spray.push({x:B.x+fm.wx+rnd(-2,2), y:B.y+fm.ly+1,
      vx:rnd(-6,6), vy:(fm.row===0?1:-1)*rnd(16,30), t:0, life:rnd(.3,.55)});
  }
}

/* ================= パーティクル ================= */
function updateParts(dt){
  const B=S.boat;
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i]; p.t+=dt;
    const u=p.t/p.dur;
    if(u>=1){
      S.flash.push({fm:p.fm, t:0});
      if(S.pops.length<64) S.pops.push({x:B.x+p.fm.tipx, y:B.y+p.fm.tipy, t:0, fv:S.fever});
      S.parts.splice(i,1); continue;
    }
    const tx=B.x+p.fm.tipx, ty=B.y+p.fm.tipy;
    p.x=p.x0+(tx-p.x0)*u;
    p.y=p.y0+(ty-p.y0)*u - Math.sin(u*Math.PI)*14;
    p.a+=dt*10;
  }
  for(let i=S.rings.length-1;i>=0;i--){ const r=S.rings[i]; r.t+=dt; if(r.t>.36) S.rings.splice(i,1); }
  for(let i=S.flash.length-1;i>=0;i--){ const f=S.flash[i]; f.t+=dt; if(f.t>.16) S.flash.splice(i,1); }
  for(let i=S.pops.length-1;i>=0;i--){ const p=S.pops[i]; p.t+=dt; if(p.t>.55) S.pops.splice(i,1); }
  for(let i=S.wake.length-1;i>=0;i--){ const w=S.wake[i]; w.t+=dt; if(w.t>1.1) S.wake.splice(i,1); }
  for(let i=S.spray.length-1;i>=0;i--){
    const s=S.spray[i]; s.t+=dt;
    if(s.t>s.life){ S.spray.splice(i,1); continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy*=0.94;
  }
}
</script>

<script>
"use strict";
/* ================= 描画 ================= */
let patDeep=null, patSurf=null, topGrad=null, bobPx=0;
function initPatterns(){
  patDeep=ctx.createPattern(seaDeep,'repeat');
  patSurf=ctx.createPattern(seaSurf,'repeat');
  topGrad=ctx.createLinearGradient(0,0,0,VH);
  topGrad.addColorStop(0,'rgba(150,214,238,.07)');
  topGrad.addColorStop(.55,'rgba(6,40,62,0)');
  topGrad.addColorStop(1,'rgba(2,14,24,.22)');
}
function drawSea(){
  const B=S.boat;
  ctx.save();
  ctx.translate(-(((B.x*.55)%64)+64)%64, -(((B.y*.55)%64)+64)%64);
  ctx.fillStyle=patDeep; ctx.fillRect(0,0,VW+64,VH+64);
  ctx.restore();
  ctx.save();
  const dx=B.x-S.t*8, dy=B.y-S.t*2.5;
  ctx.translate(-((dx%64)+64)%64, -((dy%64)+64)%64);
  ctx.fillStyle=patSurf; ctx.fillRect(0,0,VW+64,VH+64);
  ctx.restore();
  ctx.fillStyle=topGrad; ctx.fillRect(-5,-5,VW+10,VH+10);   // 揺れたぶんの余白まで塗る
}
let fishDrawn=0;
function drawSchools(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  fishDrawn=0;
  for(const s of S.schools){
    const cx=s.cx+ox, cy=s.cy+oy, krx=s.rx*s.k, kry=s.ry*s.k;
    const mg=krx+40;
    if(cx<-krx-mg||cx>VW+krx+mg||cy<-kry-mg||cy>VH+kry+mg) continue;
    // 群れの影は描かない。cx/cy/krx は画面外カリングの判定にだけ使う
    const fs=s.fish;
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      const x=f.wx+ox, y=f.wy+oy;
      if(x<-9||x>VW+9||y<-9||y>VH+9) continue;
      const ai=((Math.round(f.a/TAU*ANG)%ANG)+ANG)%ANG;
      ctx.drawImage(fishAtlas, ai*CELL, f.dd*CELL, CELL, CELL, (x-CELL/2)|0, (y-CELL/2)|0, CELL, CELL);
      fishDrawn++;
    }
  }
}
function drawChests(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  for(const c of S.chests){
    const x=Math.round(c.x+ox), y=Math.round(c.y+oy+Math.sin(c.ph)*1.5);
    if(x<-30||x>VW+30||y<-30||y>VH+30) continue;
    const g=ctx.createRadialGradient(x+9,y+8,2,x+9,y+8,26);
    g.addColorStop(0,'rgba(242,179,44,.35)'); g.addColorStop(1,'rgba(242,179,44,0)');
    ctx.fillStyle=g; ctx.fillRect(x-17,y-18,52,52);
    ctx.drawImage(chestCv,x,y);
  }
}
function drawWake(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  for(const w of S.wake){
    const u=w.t/1.1;
    ctx.globalAlpha=(1-u)*.5;
    ctx.fillStyle='#dceef6';
    ctx.fillRect(Math.round(w.x+ox), Math.round(w.y+oy+u*2), Math.round(w.r+u*3), 1);
  }
  ctx.globalAlpha=1;
}
function drawRings(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  ctx.strokeStyle='#dff0f6'; ctx.lineWidth=1;
  for(const r of S.rings){
    const u=r.t/.36, rr=2+u*8;
    ctx.globalAlpha=(1-u)*.55;
    ctx.beginPath(); ctx.ellipse(r.x+ox, r.y+oy, rr, rr*.5, 0,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawFisher(fm){
  const sp=fishers[fm.row][fm.pose][fm.pal];
  ctx.drawImage(sp.cv, Math.round(fm.lx-sp.ax), Math.round(fm.ly-sp.ay));
}
function drawBoat(){
  const b=boats[S.up.hull-1], B=S.boat;
  const sx=Math.round(VW/2), sy=Math.round(VH/2)+bobPx;
  ctx.globalAlpha=.32; ctx.fillStyle='#04202f';
  ctx.beginPath(); ctx.ellipse(sx,sy+5,b.len/2+7,7,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(sx,sy); if(B.face<0) ctx.scale(-1,1);
  for(const fm of S.crew) if(fm.row===1) drawFisher(fm);
  ctx.drawImage(b.cv, -Math.round(b.W/2), -b.waterY);
  for(const fm of S.crew) if(fm.row===0) drawFisher(fm);
  if(S.fever) ctx.drawImage(flagCv[(S.rt*11|0)&3], -Math.round(b.W/2)+9, -b.waterY+1);   // 船室の上で振る
  ctx.restore();
  const spd=Math.hypot(B.vx,B.vy);
  if(spd>6){                                   // 船首の白波
    const bx=sx+B.face*(b.len/2-2);
    ctx.fillStyle='rgba(233,246,250,.7)';
    for(let i=0;i<3;i++){
      const t=(S.t*7+i*.33)%1;
      ctx.fillRect(Math.round(bx-B.face*t*10), Math.round(sy+1+i), Math.round(2+t*4), 1);
    }
  }
}
function drawSpray(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  ctx.fillStyle='rgba(226,243,250,.7)';
  for(const s of S.spray){
    const u=s.t/s.life;
    ctx.globalAlpha=(1-u)*.8;
    ctx.fillRect(Math.round(s.x+ox), Math.round(s.y+oy), 1, 1);
  }
  ctx.globalAlpha=1;
}
function drawLines(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  const by0=VH/2+bobPx, HULL_BOT=4;
  for(const fm of S.crew){
    if(fm.pose===1) continue;
    const x0=Math.round(VW/2+fm.tipx), y0=Math.round(VH/2+fm.tipy)+bobPx;
    const dir=fm.row===0?1:-1, len=fm.lineLen, sl=fm.lineSlant;
    let lx=x0, ly=y0;
    for(let i=1;i<=len;i++){
      ly=y0+dir*i; lx=x0+Math.round(sl*i/len);
      ctx.fillStyle=(ly-by0>HULL_BOT||dir<0)?'rgba(216,232,240,.5)':'rgba(216,232,240,.2)';
      ctx.fillRect(lx,ly,1,1);
    }
    ctx.fillStyle='rgba(240,250,255,.8)';
    ctx.fillRect(lx,ly,1,1);
  }
  ctx.strokeStyle='rgba(236,247,252,.8)'; ctx.lineWidth=1;
  for(const p of S.parts){
    const tx=Math.round(VW/2+p.fm.tipx)+.5, ty=Math.round(VH/2+p.fm.tipy)+bobPx+.5;
    const px2=Math.round(p.x+ox)+.5, py2=Math.round(p.y+oy)+.5;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(px2,py2); ctx.stroke();
    const ai=((Math.round(p.a/TAU*ANG)%ANG)+ANG)%ANG;
    ctx.drawImage(fishAtlas, ai*CELL, 3*CELL, CELL, CELL, (px2-CELL/2)|0, (py2-CELL/2)|0, CELL, CELL);
  }
  for(const fl of S.flash){                      // 竿先に収まった瞬間の光
    const u=fl.t/.16, r=1+u*3.5;
    const x=Math.round(VW/2+fl.fm.tipx), y=Math.round(VH/2+fl.fm.tipy)+bobPx;
    ctx.globalAlpha=(1-u)*.9;
    ctx.fillStyle='#fff6dd';
    ctx.fillRect(x-r,y,r*2,1); ctx.fillRect(x,y-r,1,r*2);
  }
  ctx.globalAlpha=1;
}
function drawStick(){
  const st=S.stick;
  st.f+=((st.on?1:0)-st.f)*0.22;
  if(st.f<0.03) return;
  const ax=Math.round(st.ax), ay=Math.round(st.ay);
  ctx.globalAlpha=st.f*0.22;                  // 海に埋もれないよう下地を敷く
  ctx.fillStyle='#041a28';
  ctx.beginPath(); ctx.arc(ax,ay,STICK_R+2,0,TAU); ctx.fill();
  ctx.globalAlpha=st.f*0.6; ctx.fillStyle='#cfe3ec';
  for(let i=0;i<16;i++){                      // 支点の輪
    const a=i/16*TAU;
    ctx.fillRect(ax+Math.round(Math.cos(a)*STICK_R)-1, ay+Math.round(Math.sin(a)*STICK_R)-1, 2,2);
  }
  const dx=st.tx-st.ax, dy=st.ty-st.ay, m=Math.hypot(dx,dy);
  if(m>STICK_DEAD){                           // 支点から舵の向きへ点線
    ctx.globalAlpha=st.f*0.5;
    for(let i=STICK_DEAD;i<m;i+=3) ctx.fillRect(ax+Math.round(dx/m*i), ay+Math.round(dy/m*i),1,1);
  }
  ctx.globalAlpha=st.f;
  const tx=Math.round(st.tx), ty=Math.round(st.ty);
  ctx.fillStyle='#7a4f08'; ctx.fillRect(tx-3,ty-3,7,7);
  ctx.fillStyle='#f2b32c'; ctx.fillRect(tx-2,ty-2,5,5);
  ctx.fillStyle='#ffe6a8'; ctx.fillRect(tx-1,ty-1,2,2);
  ctx.globalAlpha=1;
}
function drawPops(){
  const B=S.boat, ox=VW/2-B.x, oy=VH/2-B.y;
  for(const p of S.pops){
    const u=p.t/.55, k=p.fv?2:1;
    ctx.globalAlpha=Math.min(1, u<.12 ? u/.12 : (1-u)*(1-u)*1.4);
    ctx.drawImage(p.fv?popFv:popNorm, 0,0,9,7,
      Math.round(p.x+ox)-4*k, Math.round(p.y+oy-4-u*15), 9*k, 7*k);
  }
  ctx.globalAlpha=1;
}
function drawBurst(){
  const b=S.burst; if(!b) return;
  const u=b.t/b.dur;
  if(u>=1){ S.burst=null; return; }
  const gold=b.kind!=='lv';
  if(b.kind==='cont'){ ctx.globalAlpha=(1-u)*.55; ctx.fillStyle='#ffe9b0'; ctx.fillRect(0,0,VW,VH); }
  ctx.globalAlpha=(1-u)*(1-u)*(REDUCE?.16:.62);
  ctx.fillStyle=gold?'#ffe9b0':'#ffffff';
  ctx.fillRect(0,0,VW,VH);
  const cx=VW/2, cy=VH/2+bobPx;
  ctx.globalAlpha=(1-u)*.85;
  ctx.fillStyle=gold?'#f2b32c':'#eaf3f4';
  const r0=14+u*150, len=30*(1-u);               // 放射線
  for(let i=0;i<16;i++){
    const a=i/16*TAU+b.seed, ca=Math.cos(a), sa=Math.sin(a);
    for(let r=r0;r<r0+len;r+=2) ctx.fillRect(Math.round(cx+ca*r), Math.round(cy+sa*r*.62), 3, 3);
  }
  ctx.globalAlpha=(1-u)*.7; ctx.strokeStyle=gold?'#ffe9b0':'#eaf3f4'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(cx, cy, 12+u*160, (12+u*160)*.62, 0,0,TAU); ctx.stroke();
  ctx.globalAlpha=1;
}
function draw(){
  bobPx=Math.round(Math.sin(S.boat.bob)*1.2);
  let sx=0, sy=0;
  if(!REDUCE && S.shake>0.01){
    const m=S.shake*S.shake*3.4;
    sx=Math.round(Math.sin(S.rt*82)*m); sy=Math.round(Math.cos(S.rt*67)*m);
  }
  if(sx||sy) ctx.setTransform(1,0,0,1,sx,sy);
  drawSea(); drawSchools(); drawChests(); drawRings(); drawWake();
  drawBoat(); drawSpray(); drawLines(); drawPops();
  if(sx||sy) ctx.setTransform(1,0,0,1,0,0);
  drawBurst(); drawStick();
}

/* ================= 魚群探知機 ================= */
/* 魚探の色エコー。反応が強いほど赤へ寄る、実機の配色に倣った段階色 */
const ECHO=['#17527e','#1b7f8c','#1f9a63','#63b23a','#d4c132','#e0892a','#dc4b24','#e0332c'];
const RCELL=7;                 // エコー1マスの画素数
const ECHO_DENS=250;           // 近傍平均の密度から色段階への換算係数。上げるほど赤くなりやすい
const ECHO_RANGE=68;           // 近傍として見る海の半径(px)。レンジが変わっても一定に保つ
let echoGrid=null, echoTmp=null, echoBlur=null, echoCols=0;
function drawEchoes(g,C,R,k,B,sw){
  const W=rcv.width;
  if(!echoGrid){
    echoCols=Math.ceil(W/RCELL);
    echoGrid=new Float32Array(echoCols*echoCols);
    echoTmp=new Float32Array(echoCols*echoCols);
    echoBlur=new Float32Array(echoCols*echoCols);
  }
  echoGrid.fill(0);
  for(const s of S.schools){                  // 魚を間引いて拾い、間引いた分を重みにする
    const fs=s.fish, step=Math.max(1,Math.round(s.alive/400));
    for(let i=0;i<fs.length;i+=step){
      const f=fs[i]; if(!f.alive) continue;
      const x=C+(f.wx-B.x)*k, y=C+(f.wy-B.y)*k;
      if(x<0||y<0||x>=W||y>=W) continue;
      echoGrid[((y/RCELL)|0)*echoCols+((x/RCELL)|0)]+=step;
    }
  }
  const N=echoCols;
  const kr=Math.max(1,Math.min(7,Math.round(ECHO_RANGE*k/RCELL)));   // 近傍の半径(マス)
  const EKS=kr+1;
  for(let y=0;y<N;y++){                       // 横方向
    const row=y*N;
    for(let x=0;x<N;x++){
      let a=0;
      for(let t=-kr;t<=kr;t++){ const xx=x+t; if(xx<0||xx>=N) continue; a+=echoGrid[row+xx]*(EKS-Math.abs(t)); }
      echoTmp[row+x]=a/(EKS*EKS);
    }
  }
  for(let y=0;y<N;y++){                       // 縦方向。空きセルが混じるほど平均が下がる
    for(let x=0;x<N;x++){
      let a=0;
      for(let t=-kr;t<=kr;t++){ const yy=y+t; if(yy<0||yy>=N) continue; a+=echoTmp[yy*N+x]*(EKS-Math.abs(t)); }
      echoBlur[y*N+x]=a/(EKS*EKS);
    }
  }
  const cw=RCELL/k, norm=ECHO_DENS/(cw*cw), R2=R*R, half=RCELL/2;
  for(let cy=0;cy<N;cy++){
    const py=cy*RCELL, dy=py+half-C;
    for(let cx=0;cx<N;cx++){
      if(echoGrid[cy*N+cx]<=0) continue;      // 魚がいるマスだけ点灯。色は周囲から決める
      const px2=cx*RCELL, dx=px2+half-C;
      if(dx*dx+dy*dy>R2) continue;
      const lv=Math.min(ECHO.length-1, Math.max(0, Math.round(echoBlur[cy*N+cx]*norm)-1));
      let da=sw-Math.atan2(dy,dx); da=((da%TAU)+TAU)%TAU;
      g.globalAlpha=.45+.55*(1-da/TAU);       // 掃引の残光
      g.fillStyle=ECHO[lv];
      g.fillRect(px2,py,RCELL-1,RCELL-1);
    }
  }
  g.globalAlpha=1;
}
const rcv=document.getElementById('radar'), rctx=rcv.getContext('2d');
function drawRadar(){
  const g=rctx, W=rcv.width, C=W/2, R=W/2-4, B=S.boat, range=stat.sonar(), k=R/range;
  g.clearRect(0,0,W,W);
  g.save();
  g.beginPath(); g.arc(C,C,R,0,TAU); g.clip();
  g.fillStyle='#04212e'; g.fillRect(0,0,W,W);
  g.strokeStyle='rgba(63,191,160,.20)'; g.lineWidth=1;
  for(let i=1;i<=3;i++){ g.beginPath(); g.arc(C,C,R*i/3,0,TAU); g.stroke(); }
  g.beginPath(); g.moveTo(C-R,C); g.lineTo(C+R,C); g.moveTo(C,C-R); g.lineTo(C,C+R); g.stroke();
  const sw=S.t*1.15%TAU;
  g.save();                                   // 掃引
  g.translate(C,C); g.rotate(sw);
  g.fillStyle='rgba(63,191,160,.10)';
  g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,-0.55,0); g.closePath(); g.fill();
  g.strokeStyle='rgba(63,191,160,.55)';
  g.beginPath(); g.moveTo(0,0); g.lineTo(R,0); g.stroke();
  g.restore();
  g.strokeStyle='rgba(234,243,244,.22)';      // 画面範囲
  g.strokeRect(C-VW/2*k, C-VH/2*k, VW*k, VH*k);
  drawEchoes(g,C,R,k,B,sw);                   // 魚群の反応（実位置をセルに集計）
  for(const c of S.chests){                   // 宝箱
    const x=C+(c.x-B.x)*k, y=C+(c.y-B.y)*k;
    g.fillStyle='#f2b32c';
    g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillRect(-6,-6,12,12); g.restore();
    g.fillStyle='#3a2a10'; g.font='bold '+Math.round(W/26)+'px monospace'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('?',x,y+1);
  }
  g.restore();
  const b=boats[S.up.hull-1];                 // 自船
  g.fillStyle='#eaf3f4'; g.fillRect(C-b.len*k/2, C-2, Math.max(6,b.len*k), 4);
  g.fillStyle='#e0332c'; g.fillRect(C+(S.boat.face>0?b.len*k/2-2:-b.len*k/2), C-3, 3, 6);
  g.strokeStyle='rgba(242,179,44,.5)'; g.lineWidth=2;
  g.beginPath(); g.arc(C,C,R,0,TAU); g.stroke();
}

/* ================= HUD ================= */
const frameEl=document.getElementById('frame');
const hud=document.getElementById('hud');
const elTime=document.getElementById('time'), elClock=document.getElementById('clock');
const elScore=document.getElementById('score'), elFill=document.getElementById('lvfill');
const elLvNum=document.getElementById('lvnum'), elStats=document.getElementById('stats');
const toastEl=document.getElementById('toast'), toastItems=document.getElementById('toastitems');
const chipEls={};
function buildChips(){
  UPG.forEach(u=>{
    const d=document.createElement('div'); d.className='chip';
    const c=document.createElement('canvas'); c.width=16;c.height=16;
    c.getContext('2d').drawImage(ICONS[u.id],0,0);
    const b=document.createElement('b'); b.dataset.k='up.'+u.id+'.short'; b.textContent=t('up.'+u.id+'.short');
    const i=document.createElement('i');
    d.append(c,b,i); elStats.appendChild(d);
    d.title=t('up.'+u.id+'.name')+'（デバッグ中のみ 左クリック+1 / 右クリック-1 / Shiftで5段）';
    d.addEventListener('click',e=>{ if(!perf.on) return;
      e.preventDefault(); e.stopPropagation(); bump(u, e.shiftKey?5:1); });
    d.addEventListener('contextmenu',e=>{ if(!perf.on) return;
      e.preventDefault(); e.stopPropagation(); bump(u, e.shiftKey?-5:-1); });
    chipEls[u.id]={box:d,val:i};
  });
}
function bump(u,n){                     // デバッグ用：強化を直接増減する
  if(u.id==='crew')       S.up.crew=clamp(S.up.crew+n,0,200);
  else if(u.id==='hull')  S.up.hull=clamp(S.up.hull+n,1,5);
  else if(u.id==='sonar') S.up.sonar=clamp(S.up.sonar+n,1,u.max);
  else                    S.up[u.id]=clamp(S.up[u.id]+n,0,u.max);
  layoutCrew(); updateHUD();
}
let lastTxt={};
function setTxt(el,v){ if(lastTxt[el.id]!==v){ lastTxt[el.id]=v; el.textContent=v; } }
const elCatch=document.querySelector('.catch'), elFever=document.getElementById('fever');
const elFvBadge=document.getElementById('fvbadge'), elFvChain=document.getElementById('fvchain');
const elFvBig=document.getElementById('fvbig');
const elFvBar=document.getElementById('fvbar');
const elFvRound=document.getElementById('fvround');
function updateHUD(){
  const rem=Math.max(0,GAME_TIME-S.t);
  elScore.style.transform = S.pop>0.01 ? 'scale('+(1+0.26*S.pop)+')' : '';
  const playing=S.mode==='play';
  elFever.style.opacity = S.fever ? '1' : '0';
  elFever.classList.toggle('hot', S.fever && playing);
  elCatch.classList.toggle('hot', S.fever);
  elFvBadge.classList.toggle('on', S.fever && playing);   // 3択の見出しと重なるので伏せる
  if(S.fever){
    setTxt(elFvChain, S.chain+t('hud.catchUnit'));
    const u=clamp(S.fvT/FV_ROUND,0,1);
    elFvBar.style.width=(u*100).toFixed(1)+'%';
    elFvBar.classList.toggle('low', u<0.25);       // 継続抽選が近い
    setTxt(elFvRound, t('hud.round',{n:S.fvRound}));
    elFvBadge.style.transform='translate(-50%,0) scale('+(1+0.10*S.fvPulse).toFixed(3)+')';
  }
  setTxt(elTime, rem>10 ? Math.floor(rem/60)+':'+String(Math.floor(rem%60)).padStart(2,'0') : rem.toFixed(1));
  elClock.classList.toggle('warn', rem<=15);
  setTxt(elScore, fmt(S.score));
  setTxt(elLvNum, S.prog+' / '+S.need);
  elFill.style.width=clamp(S.prog/S.need*100,0,100)+'%';
  UPG.forEach(u=>{
    const c=chipEls[u.id]; if(!c) return;
    const lv=u.lv(), on = u.id==='crew' ? true : (u.id==='hull'||u.id==='sonar' ? lv>1 : lv>0);
    c.box.classList.toggle('has', on);
    const v=valOf(u.id,S.up);
    c.val.innerHTML = v.h + (v.u?'<u>'+v.u+'</u>':'');
  });
}

function choose(i){

window.addEventListener('keydown',e=>{

/* ================= 開始・終了 ================= */
const scrResult=document.getElementById('result'), promptEl=document.getElementById('prompt');
function reset(){
  S.t=0; S.started=false; S.score=0; S.level=1; S.need=9; S.prog=0; S.totalFish=0; S.chestT=20;
  S.schools.length=0; S.chests.length=0; S.crew.length=0;
  S.parts.length=0; S.wake.length=0; S.rings.length=0; S.spray.length=0; S.flash.length=0; S.pops.length=0;
  S.fvT=0; S.fvRound=0; S.fvLock=0; S.fvPulse=0; S.fever=false; S.chain=0; S.inRange=0; S.fvIdle=0; S.pop=0; S.shake=0; S.freeze=0; S.burst=null;
  S.up={crew:2,hull:1,rate:0,engine:0,sonar:1,lure:1};
  S.start={crew:2,hull:1,rate:0,engine:0,sonar:1,lure:1};

}
function startGame(){          // リザルトからのやり直し
  audioInit(); reset();

  promptEl.classList.add('gone');
  scrResult.classList.remove('on');

}
function beginRun(){           // 最初の入力で走り出す
  if(S.started || S.mode!=='play') return;
  S.started=true;
  audioInit();
  promptEl.classList.add('gone');
  hud.classList.add('on');

const RANKS=[1500,3000,5000,7000,10000,1e9];
function endGame(){
  S.mode='result'; S.started=false; hud.classList.remove('on');
  S.fever=false; S.fvT=0; elFever.style.opacity='0'; elFvBadge.classList.remove('on'); elFvBadge.style.transform=''; elFvBig.classList.remove('go');

    t('res.grow',{a:'<s>'+p0.toFixed(1)+'</s>',b:'<b>'+p1.toFixed(1)+'</b>'})+' <em>'+t('res.growX',{c:(p1/p0).toFixed(1)})+'</em>';

    }).join('');
  document.getElementById('rbest').textContent=t('res.best',{n:fmt(S.best)});
  scrResult.classList.add('on');
  sfxEnd();

/* ================= 入力 ================= */
const STICK_R=26, STICK_DEAD=5;
function onField(e){ return e.target===cv || e.target===frameEl; }
function toLocal(e){
  const r=frameEl.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH};
}
function aimMouse(e){                      // PC：画面中央から見た向き
  if(!onField(e)) return;
  beginRun();
  const r=frameEl.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy), dead=r.width*0.045;
  if(m<dead){ S.dir.x=0; S.dir.y=0; }
  else { S.dir.x=dx/m; S.dir.y=dy/m; }
}
frameEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){ aimMouse(e); return; }
  if(!onField(e) || S.stick.id!==-1) return;   // 重なった2本目の指は無視
  e.preventDefault();
  const p=toLocal(e), st=S.stick;
  st.id=e.pointerId; st.on=true;
  st.ax=p.x; st.ay=p.y; st.tx=p.x; st.ty=p.y;
  beginRun();
});
frameEl.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){ aimMouse(e); return; }
  const st=S.stick;
  if(e.pointerId!==st.id) return;
  e.preventDefault();
  const p=toLocal(e);
  let dx=p.x-st.ax, dy=p.y-st.ay, m=Math.hypot(dx,dy);
  if(m>STICK_R){                              // 引っ張りすぎたら支点を連れていく
    const k=1-STICK_R/m;
    st.ax+=dx*k; st.ay+=dy*k;
    dx*=STICK_R/m; dy*=STICK_R/m; m=STICK_R;
  }
  st.tx=st.ax+dx; st.ty=st.ay+dy;
  if(m>STICK_DEAD){ S.dir.x=dx/m; S.dir.y=dy/m; }   // 内側では舵を変えない
});
function endStick(e){
  if(e.pointerId===S.stick.id){ S.stick.id=-1; S.stick.on=false; }  // 離しても進路は維持
}
frameEl.addEventListener('pointerdown',()=>audioInit());
frameEl.addEventListener('pointerup',endStick);
frameEl.addEventListener('pointercancel',endStick);
document.getElementById('retry').addEventListener('click',startGame);

/* ================= 音 ================= */
let AC=null,MG=null,muted=false,lastCatchS=0,noiseBuf=null,lastSec=GAME_TIME;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain(); MG.gain.value=.32; MG.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  }catch(err){ AC=null; }
}
function tone(f,dur,type,gain,slide,delay){
  if(!AC||muted) return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+.03);
}
function splash(gain){
  if(!AC||muted||!noiseBuf) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=rnd(1600,3200); bp.Q.value=1.1;
  const g=AC.createGain(); g.gain.value=gain;
  s.connect(bp); bp.connect(g); g.connect(MG); s.start();
}
function sfxCatch(){
  if(!AC||muted) return;
  const now=AC.currentTime;
  if(now-lastCatchS<.026) return;
  lastCatchS=now;
  const up=1+0.95*Math.min(1,S.chain/40);        // 連が伸びるほど高く
  tone(rnd(640,1020)*up,.07,'triangle',.055,1.7);
  if(Math.random()<.5) splash(.03);
}
function sfxCont(){                                // 継続した合図。1段上がる
  tone(392,.16,'square',.07,1.5);
  tone(784,.2,'triangle',.07,1.4,.05);
}
function sfxFever(){
  tone(98,.55,'sawtooth',.13,.62);                // 腹に来る低音を1発
  tone(147,.4,'sine',.10,.7,.02);
  [523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.07,1.25,.06+i*.05));
}
function sfxLevel(){ [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.09,1,i*.07)); }
function sfxPick(){ tone(880,.12,'square',.05,1.2); }
function sfxChest(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,.26,'triangle',.08,1,i*.06)); }
function sfxEnd(){ tone(196,1.4,'sawtooth',.10,.7); tone(147,1.6,'sine',.08,.75,.05); }
function tickCountdown(){
  const rem=Math.ceil(GAME_TIME-S.t);
  if(rem<lastSec){ lastSec=rem; if(rem<=5&&rem>0) tone(1046,.09,'square',.06); }
}
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.textContent=muted?'♪̸':'♪';
  muteBtn.style.color=muted?'#4a6577':''; });

/* ================= 負荷計測（Fキーで開閉） ================= */
const elPerf=document.getElementById('perf');
const perf={on:false, acc:0, n:0, upd:0, drw:0, worst:0};
function perfToggle(v){
  perf.on = v===undefined ? !perf.on : v;
  elPerf.hidden=!perf.on;
  elStats.classList.toggle('dbg', perf.on);
  perf.acc=perf.n=perf.upd=perf.drw=perf.worst=0;
  try{ localStorage.setItem('ippon.perf', perf.on?'1':'0'); }catch(e){}
}
function perfTick(raw,u,d){
  perf.acc+=raw; perf.n++; perf.upd+=u; perf.drw+=d;
  const ft=u+d; if(ft>perf.worst) perf.worst=ft;
  if(perf.acc<0.25) return;
  const fps=perf.n/perf.acc, ms=perf.acc/perf.n*1000;
  const up=perf.upd/perf.n, dr=perf.drw/perf.n;
  const hot=v=>v>=8?' class="hot"':'';
  elPerf.innerHTML=
    '<b'+(fps<50?' class="hot"':'')+'>'+fps.toFixed(1)+'</b> fps <u>'+ms.toFixed(1)+'ms</u>\n'+
    '更新 <i>'+up.toFixed(2)+'</i>  描画 <i'+hot(dr)+'>'+dr.toFixed(2)+'</i>  最悪 <i'+hot(perf.worst)+'>'+perf.worst.toFixed(1)+'</i> ms\n'+
    '魚 <b>'+fmt(S.totalFish)+'</b> 画面 <b>'+fmt(fishDrawn)+'</b>  群 <b>'+S.schools.length+'</b>\n'+
    '漁師 <b>'+S.crew.length+'</b>  竿 <b>'+S.parts.length+'</b>  飛沫 <b>'+(S.spray.length+S.wake.length+S.rings.length)+'</b>\n'+
    '<u>チップ 左+1 右-1 Shiftで5段</u>';
  perf.acc=perf.n=perf.upd=perf.drw=perf.worst=0;
}
window.addEventListener('keydown',e=>{
  if((e.key==='f'||e.key==='F') && !e.metaKey && !e.ctrlKey && !e.altKey) perfToggle();
});

/* ================= ループ ================= */
let last=performance.now();
function tick(now){
  const raw=(now-last)/1000; last=now;
  const dt=raw>.05?.05:raw;
  const p0=performance.now();
  S.rt+=dt;
  S.pop=Math.max(0,S.pop-dt*4.2);
  S.fvPulse=Math.max(0,S.fvPulse-dt*5);
  S.shake=Math.max(0,S.shake-dt*3.4);
  if(S.burst) S.burst.t+=dt;
  if(S.freeze>0) S.freeze-=dt;                   // 止まっている間も閃光だけは進む
  else if(S.mode==='play'){
    if(S.started) S.t+=dt;
    updateBoat(dt); manageWorld(dt); updateSchools(dt);
    if(S.started){ updateFishing(dt); updateFever(dt); }
    updateParts(dt);
    if(S.started){ tickCountdown(); if(S.t>=GAME_TIME) endGame(); }
  }
  const p1=performance.now();
  draw(); drawRadar(); updateHUD();
  if(perf.on) perfTick(raw, p1-p0, performance.now()-p1);
  requestAnimationFrame(tick);
}

/* ================= 言語の適用 ================= */

  set('lblPickEyebrow','pick.eyebrow'); set('lblPickHead','pick.head'); set('lblResHead','res.head');
  document.querySelectorAll('#stats .chip b[data-k]').forEach(b=>{ b.textContent=t(b.dataset.k); });

window.setGameLang=c=>{ setLang(c); applyLang(); };   // Playables では getLanguage の結果を渡す
window.addEventListener('keydown',e=>{                 // 検証用：デバッグ表示中に L で切り替え
  if(perf.on && (e.key==='l'||e.key==='L')) window.setGameLang(LANG==='ja'?'en':'ja');
});

/* ================= 起動 ================= */
initAssets(); initPatterns(); buildChips();
try{ const q=new URLSearchParams(location.search).get('lang'); if(q) setLang(q); }catch(e){}
S.best=loadBest();
try{ if(localStorage.getItem('ippon.perf')==='1') perfToggle(true); }catch(e){}
applyLang();
reset(); S.mode='play'; S.started=false;
requestAnimationFrame(tick);
